
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text Extractor</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:14px;
 background:#0b1020;color:#edf2ff;
 font:14px system-ui,sans-serif
}
main{max-width:650px;margin:auto}
h2{font-size:22px;margin:0 0 5px}
p{color:#aab7d0;font-size:12px;margin:0 0 14px}
.card{
 background:#141d32;border:1px solid #293754;
 border-radius:13px;padding:13px;margin-bottom:12px
}
label{display:block;margin-bottom:6px;font-weight:600}
input,textarea{
 width:100%;padding:10px;border-radius:8px;
 border:1px solid #344363;background:#0b1326;
 color:#edf2ff;font:inherit;outline:none
}
textarea{height:220px;resize:vertical;line-height:1.45}
.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
button{
 flex:1;padding:9px 10px;border:0;border-radius:8px;
 background:#293957;color:white;font-weight:600;font-size:13px;
 cursor:pointer
}
.primary{background:#8494ff;color:#080d1c}
button:disabled{opacity:.5;cursor:wait}
#status{font-size:12px;color:#b9c7e4;margin-top:9px}
.stats{font-size:11px;color:#aab7d0;margin-top:5px}
</style>
</head>
<body>
<main>
<h2>Text Extractor</h2>
<p>Extract, copy, and download text from web pages.</p>

<section class="card">
<label for="url">Page URL</label>
<input id="url" type="url"
 placeholder="https://example.com/article">

<div class="row">
<button class="primary" id="extract">Extract Text</button>
</div>
<div id="status" role="status" aria-live="polite"></div>
</section>

<section class="card">
<label for="output">Extracted Text</label>
<textarea id="output"
 placeholder="The page text will appear here..."
 spellcheck="false"></textarea>
<div class="stats" id="stats">0 characters · 0 words</div>
<div class="row">
<button class="primary" id="copy">Copy Text</button>
<button id="download">Download TXT</button>
<button id="clear">Clear</button>
</div>
</section>
</main>

<script>
const WORKER =
 "https://twilight-fog-ab5c.daniilox415.workers.dev";

const $ = id => document.getElementById(id);
const status = $("status");
const output = $("output");

function getUrl(){
 try{
  const u = new URL($("url").value.trim());
  if(!["http:","https:"].includes(u.protocol)) throw 0;
  return u.href;
 }catch{
  status.textContent =
   "Enter a valid URL starting with http:// or https://.";
  return null;
 }
}

function updateStats(){
 const t = output.value;
 const words = t.trim() ? t.trim().split(/\s+/u).length : 0;
 $("stats").textContent =
  t.length.toLocaleString("en-US")+" characters · "+
  words.toLocaleString("en-US")+" words";
}

$("extract").onclick = async () => {
 const url = getUrl();
 if(!url) return;

 const btn = $("extract");
 btn.disabled = true;
 status.textContent = "Loading page...";

 try{
  const response = await fetch(
   WORKER + "/?url=" + encodeURIComponent(url)
  );
  const data = await response.json();

  if(!response.ok)
   throw new Error(data.error || "HTTP "+response.status);

  if(!data.text || !data.text.trim())
   throw new Error("No text found.");

  output.value = data.text;
  updateStats();
  status.textContent = "Text extracted successfully.";
 }catch(e){
  status.textContent = "Error: "+e.message;
 }finally{
  btn.disabled = false;
 }
};

$("copy").onclick = async () => {
 if(!output.value){
  status.textContent = "There is no text to copy.";
  return;
 }
 try{
  await navigator.clipboard.writeText(output.value);
  status.textContent = "Text copied to clipboard.";
 }catch{
  output.focus();
  output.select();
  status.textContent =
   "Text selected. Copy it manually.";
 }
};

$("download").onclick = () => {
 if(!output.value){
  status.textContent = "There is no text to download.";
  return;
 }
 const blob = new Blob(
  ["\uFEFF",output.value],
  {type:"text/plain;charset=utf-8"}
 );
 const a = document.createElement("a");
 a.href = URL.createObjectURL(blob);
 a.download = "page-text.txt";
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

$("clear").onclick = () => {
 output.value = "";
 updateStats();
 status.textContent = "Text cleared.";
};

output.addEventListener("input",updateStats);
</script>
</body>
</html>
